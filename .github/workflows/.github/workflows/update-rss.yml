name: Update RSS Feed

on:
  schedule:
    - cron: '0 * * * *'   # හැම පැයකට වරක්
  workflow_dispatch:       # අතින් run කරන්නත් පුළුවන්

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate RSS
        run: node generate-rss.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add rss.xml
          git diff --staged --quiet || (git commit -m "Auto-update RSS" && git push)
